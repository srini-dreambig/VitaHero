# Deploy the backend and admin console to your own Cloudflare account.
#
# Until this existed the worker was only deployable through Rork's platform,
# to kidhero-health-sync-backend.rork.app — their domain, their account, and
# no way to ship a fix without them. functions/wrangler.toml plus this is the
# whole of what it takes to own it.
#
# Set up, once:
#
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token →
#      "Edit Cloudflare Workers". Scope it to your account. Copy the token.
#   2. Repository secrets:
#        CLOUDFLARE_API_TOKEN
#        CLOUDFLARE_ACCOUNT_ID   (dashboard → Workers & Pages → Account ID)
#   3. The worker's own secrets, once, from your machine — they live in
#      Cloudflare, not here, so they are never passed through a build:
#        cd functions
#        npx wrangler secret put DATABASE_URL
#        npx wrangler secret put ADMIN_API_KEY
#        npx wrangler secret put INVITE_SIGNING_KEY
#        npx wrangler secret put TEXTBEE_API_KEY
#        npx wrangler secret put TEXTBEE_DEVICE_ID
#
# After the first deploy the console is at
# https://vitahero-backend.<your-subdomain>.workers.dev/admin, and the Android
# app needs RORK_FUNCTIONS_URL pointed at that origin — otherwise it keeps
# talking to Rork's copy, which is the whole thing you are moving away from.
name: Deploy worker

on:
  push:
    branches: ["main"]
    paths: ["functions/**", ".github/workflows/worker-deploy.yml"]
  workflow_dispatch:

# A second push while the first is still deploying would race, and the loser
# would be whichever finished last rather than whichever is newer.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest

    # The worker is the only thing between a parent and their child's results.
    # Deploying it without running the SQL suites against a real database is
    # how a migration reaches production untested.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitahero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: functions
        run: bun install --frozen-lockfile

      - name: Types
        working-directory: functions
        run: bunx tsc --noEmit

      - name: Tests
        working-directory: functions
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vitahero_test
        run: bun test

      # Catches a config or bundling error here rather than half way through a
      # deploy, and costs seconds.
      - name: Bundle
        working-directory: functions
        run: bunx wrangler deploy --dry-run

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: functions
        run: bun install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: functions
          # Pinned rather than "latest": a wrangler major bump changing
          # defaults under a deploy nobody is watching is not a surprise worth
          # having.
          wranglerVersion: "4.135.0"

      # The console is the half a person looks at, so the deploy is not
      # finished until it actually answers.
      - name: Smoke the deployed worker
        env:
          BASE: ${{ vars.WORKER_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "::notice::Set the WORKER_BASE_URL repository variable to smoke-test each deploy."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/admin" --max-time 30)
          echo "GET $BASE/admin -> $code"
          test "$code" = "200"
