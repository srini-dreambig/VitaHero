# Build the signed iOS app and upload it to Apple App Store Connect / TestFlight.
#
# Runs entirely on GitHub Actions cloud macOS runners (free Apple Silicon Mac).
#
# Prerequisites before running:
#
#   1. Enroll in Apple Developer Program (https://developer.apple.com).
#   2. Register App ID: com.vitahero.health (or your custom bundle id).
#   3. Create an App Store Connect API Key:
#      - Go to https://appstoreconnect.apple.com -> Users and Access -> Integrations -> App Store Connect API
#      - Click "+" to generate an API key with "Admin" or "App Manager" role.
#      - Download the AuthKey_XXXXXX.p8 file (note: Apple allows downloading this only once).
#      - Note the Key ID and Issuer ID.
#   4. Add these GitHub Repository Secrets (Settings -> Secrets and variables -> Actions):
#
#        APP_STORE_CONNECT_KEY_ID       (e.g. 2X9R427NDK)
#        APP_STORE_CONNECT_ISSUER_ID    (e.g. 57246542-96fe-1a63-e053-0824d011072a)
#        APP_STORE_CONNECT_PRIVATE_KEY  (Paste the full text content of AuthKey_XXXXXX.p8)
#        APPLE_CERTIFICATE_BASE64       (Base64 string of your .p12 Distribution certificate, or leave empty if using automatic cloud signing)
#        APPLE_CERTIFICATE_PASSWORD     (Password for the .p12 certificate, if applicable)
#        APPLE_PROVISIONING_PROFILE_BASE64 (Base64 string of your App Store .mobileprovision, if manual signing)
#        APPLE_TEAM_ID                  (10-character Apple Developer Team ID, e.g. ABCDE12345)
#        GOOGLE_SERVICE_INFO_PLIST_BASE64 (Base64 of GoogleService-Info.plist for the iOS app
#                                        com.vitahero.health in Firebase project vitahero-8c5c0)
#
name: Publish to Apple App Store (TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: "Upload IPA to App Store Connect / TestFlight"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build & Publish iOS App
    # App Store Connect accepts uploads only from a recent Xcode, so this
    # takes the newest one the runner image has.
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Setup App Store Connect Private Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Write Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set. Without it the app cannot sign anyone in."
            exit 1
          fi
          PLIST=ios/VitaHero/GoogleService-Info.plist
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode -o "$PLIST"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$PLIST")
          if [ "$BUNDLE" != "com.vitahero.health" ]; then
            echo "::error::GoogleService-Info.plist is for $BUNDLE, not com.vitahero.health."
            exit 1
          fi
          # The scheme Firebase's reCAPTCHA check returns to after verifying the app:
          # REVERSED_CLIENT_ID when the plist has one, else the Encoded App ID
          # (GOOGLE_APP_ID with ':' as '-', after "app-"), which newer plists need.
          SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$PLIST" 2>/dev/null || true)
          if [ -z "$SCHEME" ]; then
            APP_ID=$(/usr/libexec/PlistBuddy -c "Print :GOOGLE_APP_ID" "$PLIST")
            SCHEME="app-$(echo "$APP_ID" | tr ':' '-')"
          fi
          echo "URL scheme: $SCHEME"
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $SCHEME" ios/VitaHero/Info.plist

      - name: Generate Xcode Project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          xcodegen generate
          ls -la VitaHero.xcodeproj

      - name: Install Apple Certificate & Profile (if provided)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temp-build-keychain-pass"
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing distribution certificate into temporary keychain..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
              echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
            fi

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH
          else
            echo "No manual .p12 certificate secret provided. Using Xcode App Store Connect API automatic signing."
          fi

      - name: Build Archive
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p build
          
          # Optional team id injection
          TEAM_ARG=""
          if [ -n "$APPLE_TEAM_ID" ]; then
            TEAM_ARG="DEVELOPMENT_TEAM=$APPLE_TEAM_ID"
          fi

          AUTH_ARGS=""
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            AUTH_ARGS="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 -authenticationKeyID ${APP_STORE_CONNECT_KEY_ID} -authenticationKeyIssuerID ${APP_STORE_CONNECT_ISSUER_ID}"
          fi

          # Without a .p12, automatic signing would sign the archive for
          # development, and Apple only issues a development profile to a team
          # with a registered device. Archive unsigned instead; the export below
          # signs for the App Store with a cloud-managed distribution
          # certificate, which needs no device.
          UNSIGNED_ARGS=""
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            UNSIGNED_ARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          fi

          # Each upload needs a build number App Store Connect has not seen.
          BUILD_NUMBER=$((100 + ${{ github.run_number }}))

          echo "Archiving VitaHero build $BUILD_NUMBER with Xcode..."
          xcodebuild archive \
            -project ios/VitaHero.xcodeproj \
            -scheme VitaHero \
            -configuration Release \
            -archivePath build/VitaHero.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            $TEAM_ARG \
            $AUTH_ARGS \
            $UNSIGNED_ARGS

      - name: Export IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Automatic App Store signing needs to know the team to sign for.
          if [ -n "$APPLE_TEAM_ID" ]; then
            /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions.plist
            /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" ios/ExportOptions.plist
          fi

          AUTH_ARGS=""
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            AUTH_ARGS="-allowProvisioningUpdates -authenticationKeyPath $HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 -authenticationKeyID ${APP_STORE_CONNECT_KEY_ID} -authenticationKeyIssuerID ${APP_STORE_CONNECT_ISSUER_ID}"
          fi

          xcodebuild -exportArchive \
            -archivePath build/VitaHero.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            $AUTH_ARGS
          
          ls -la build/ipa/

      - name: Upload IPA as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaHero-iOS-IPA
          path: build/ipa/*.ipa

      - name: Upload to App Store Connect / TestFlight
        if: ${{ inputs.upload_to_app_store == true }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No IPA found in build/ipa directory"
            exit 1
          fi

          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "Successfully uploaded to App Store Connect! Check TestFlight in 10-15 minutes."
