# Build the signed bundle and upload it to Google Play.
#
# Manual only. There is no push trigger and there will not be one: a release to
# a store is a decision, and the Gradle config is already built around making it
# hard to reach production by accident — no default track, and a draft release
# unless somebody says otherwise. This mirrors that rather than routing around
# it.
#
# Before the first run:
#
#   1. Upload one bundle by hand in the Play Console. The Publisher API can add
#      a release to a listing; it cannot create the listing.
#   2. Play Console → Users and permissions → invite a service account with
#      "Release apps to testing tracks" (and production only if you want that
#      from here). Google Cloud → that account → Keys → JSON key.
#   3. Add these repository secrets:
#
#        PLAY_SERVICE_ACCOUNT_JSON   the whole JSON key file, pasted
#        UPLOAD_KEYSTORE_BASE64      base64 -w0 of the .jks
#        UPLOAD_KEYSTORE_PASSWORD
#        UPLOAD_KEY_ALIAS
#        UPLOAD_KEY_PASSWORD
#
# On the keystore: the one this repository used was committed to git history at
# releases/vitahero-upload-key.jks with its passwords in a plaintext file beside
# it. Anything in git history is compromised. Rotate the upload key with Play
# App Signing before using this, and put the new one in secrets only — never
# back in the tree.
name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        required: true
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status — draft lands in the console for a human to roll out"
        required: true
        type: choice
        default: draft
        options: [draft, inProgress, completed]
      promote_from:
        # A version code goes to Play once. To put a build that is already on
        # one track onto another, it is promoted there, not uploaded again.
        description: "Promote the release already on this track instead of uploading a new bundle"
        required: true
        type: choice
        default: none
        options: [none, internal, alpha, beta]
      listing:
        # The store listing rather than a release. "show" downloads what Play
        # has now and changes nothing; "screenshots" replaces the phone
        # screenshots with the ones an android-screenshots.yml run took, in
        # every language the listing has, and leaves the text alone.
        description: "Store listing instead of a release"
        required: true
        type: choice
        default: none
        options: [none, show, screenshots]
      screenshots_run:
        description: "For listing=screenshots: the android-screenshots.yml run id"
        required: false
        type: string

permissions:
  contents: read
  actions: read  # to fetch another run's screenshots

jobs:
  publish:
    name: "${{ inputs.listing != 'none' && format('listing ({0})', inputs.listing) || format('{0} ({1})', inputs.track, inputs.status) }}"
    runs-on: ubuntu-latest
    # A track, not a branch. GitHub asks for an approval before the job starts
    # if the environment has reviewers on it, which is the check worth having
    # on the production track.
    environment: play-${{ inputs.track }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Written outside the workspace so a stray `git add -A` in a later step
      # cannot pick them up, and removed again whatever happens.
      - name: Write credentials
        id: creds
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLAY_JSON"     || { echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; }
          test -n "$KEYSTORE_B64"  || { echo "::error::UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          dir="$(mktemp -d)"
          umask 077
          printf '%s' "$PLAY_JSON" > "$dir/play.json"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/upload.jks"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        if: inputs.promote_from == 'none' && inputs.listing == 'none'
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ steps.creds.outputs.dir }}/play.json
          VITAHERO_KEYSTORE: ${{ steps.creds.outputs.dir }}/upload.jks
          VITAHERO_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          VITAHERO_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          VITAHERO_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
        run: ./gradlew :app:publishReleaseBundle --stacktrace

      - name: Promote
        if: inputs.promote_from != 'none' && inputs.listing == 'none'
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ steps.creds.outputs.dir }}/play.json
          VITAHERO_KEYSTORE: ${{ steps.creds.outputs.dir }}/upload.jks
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_RELEASE_STATUS: ${{ inputs.status }}
          FROM_TRACK: ${{ inputs.promote_from }}
        run: |
          test "$FROM_TRACK" != "$PLAY_TRACK" || { echo "::error::promote_from and track are the same"; exit 1; }
          ./gradlew :app:promoteReleaseArtifact --from-track "$FROM_TRACK" --promote-track "$PLAY_TRACK" --release-status "$PLAY_RELEASE_STATUS" --stacktrace

      # Read-only: GPP writes the live listing under src/*/play.
      - name: Show listing
        if: inputs.listing == 'show'
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ steps.creds.outputs.dir }}/play.json
        run: |
          ./gradlew :app:bootstrapReleaseListing --listings --stacktrace
          find app/src -path '*/play/*' -type f -printf '%10s  %p\n' | sort -k2

      - name: Keep the listing
        if: inputs.listing == 'show'
        uses: actions/upload-artifact@v4
        with:
          name: play-listing
          path: android/app/src/*/play

      - name: Fetch screenshots
        if: inputs.listing == 'screenshots'
        uses: actions/download-artifact@v4
        with:
          name: play-store-screenshots
          path: shots
          run-id: ${{ inputs.screenshots_run }}
          github-token: ${{ github.token }}

      # Only graphics/phone-screenshots is written, so that is all GPP sends:
      # Play replaces that one image set and the rest of the listing stays.
      - name: Replace phone screenshots
        if: inputs.listing == 'screenshots'
        working-directory: android
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ steps.creds.outputs.dir }}/play.json
          VITAHERO_KEYSTORE: ${{ steps.creds.outputs.dir }}/upload.jks
          PLAY_TRACK: ${{ inputs.track }}
          RUN: ${{ inputs.screenshots_run }}
        run: |
          set -euo pipefail
          test -n "$RUN" || { echo "::error::screenshots_run is not set"; exit 1; }
          ls ../shots/phone/*.png > /dev/null
          # Which languages the listing has, from Play itself.
          ./gradlew :app:bootstrapReleaseListing --listings -q
          locales=$(ls -d app/src/main/play/listings/*/ | xargs -n1 basename)
          rm -rf app/src/main/play
          for l in $locales; do
            d=app/src/main/play/listings/$l/graphics/phone-screenshots
            mkdir -p "$d"
            cp ../shots/phone/*.png "$d/"
            echo "$l: $(ls "$d" | tr '\n' ' ')"
          done
          ./gradlew :app:publishReleaseListing --stacktrace

      # Kept for matching a crash report to a build. The bundle is signed with
      # the upload key, not the app signing key, so it is not installable as-is
      # — it is evidence, not a release.
      - name: Keep the bundle
        if: always() && inputs.listing == 'none'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ inputs.track }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Shred credentials
        if: always()
        run: rm -rf "${{ steps.creds.outputs.dir }}"
