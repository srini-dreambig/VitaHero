org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# Windows: avoid file-lock errors during dependency transforms (AccessDeniedException)
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false
org.gradle.workers.max=1

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# ── AGP 9 opt-outs ────────────────────────────────────────────────────────
#
# Everything below turns off a default that AGP 9 turned on. Each one is a
# deprecation warning on every build and each is scheduled for removal in AGP
# 10, so the flag is a countdown rather than a setting.
#
# Five others were removed rather than kept, because they were switching off
# behaviour this project never uses, which is the worst kind of opt-out: it
# looks load-bearing and is not.
#
#   android.usesSdkInManifest.disallowed  — the manifest declares no uses-sdk.
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset — targetSdk is set to 36
#       explicitly, so there is nothing to default.
#   android.defaults.buildfeatures.resvalues — nothing calls resValue().
#   android.r8.optimizedResourceShrinking — shrinkResources is never enabled,
#       so no resource shrinking runs at all.
#   android.enableAppCompileTimeRClass — one app module with a non-transitive
#       R class, which is the shape the compile-time R class is for.
#
# These two are still here because removing them is not a flag change:
#
#   builtInKotlin — AGP 9 compiles Kotlin itself, and switching to it means
#       dropping the org.jetbrains.kotlin.android plugin. That is a migration,
#       and it is the next thing to do here.
#   newDsl — turning this on disables the legacy variant API. Nothing in this
#       repository calls applicationVariants, testVariants or unitTestVariants;
#       a plugin does, and finding out which is what the migration starts with.
android.builtInKotlin=false
android.newDsl=false
