org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# Windows: avoid file-lock errors during dependency transforms (AccessDeniedException)
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false
org.gradle.workers.max=1

android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# ── AGP 9 ─────────────────────────────────────────────────────────────────
#
# No opt-outs left. Seven android.* flags here each switched off a default AGP
# 9 turned on, each printed a deprecation warning on every build, and each is
# scheduled for removal in AGP 10 — a countdown rather than a setting.
#
# Five were switching off behaviour this project never uses: no uses-sdk in the
# manifest, targetSdk set explicitly, no resValue(), no shrinkResources, one app
# module with a non-transitive R class.
#
# The last two, builtInKotlin and newDsl, went together because they were one
# problem. Three warnings said the legacy variant API was being called and
# nothing in this repository calls it, so it was a plugin — and the guess was
# play-publisher, which would have pinned this until Triple-T shipped a release
# that did not exist. -Pandroid.debug.obsoleteApi=true named the real caller
# instead: "The 'kotlin-android' plugin is currently calling this deprecated
# API." Dropping that plugin for AGP's built-in Kotlin removed the calls, and
# with them the reason newDsl was off.
