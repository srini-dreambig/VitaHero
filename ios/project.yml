name: VitaHero
options:
  bundleIdPrefix: com.vitahero
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    # CI passes CURRENT_PROJECT_VERSION=<run number>, so every TestFlight
    # upload carries a new build number.
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"

targets:
  VitaHero:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # GoogleService-Info.plist is picked up from VitaHero/ when CI has written
    # it there from a secret. It is never committed (see .gitignore); a build
    # without it launches and says sign-in is not set up.
    sources:
      - path: VitaHero
        excludes:
          - Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        PRODUCT_NAME: VitaHero
        PRODUCT_BUNDLE_IDENTIFIER: com.vitahero.health
        INFOPLIST_FILE: VitaHero/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - VitaHeroTests

  # The clinician form's required-field rules, held to the server's tests.
  # RequiredChecks.swift is Foundation only and is compiled in directly, so
  # the tests need no app host, no Firebase and no signing.
  VitaHeroTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VitaHeroTests
      - path: VitaHero/Clinician/RequiredChecks.swift
      - path: VitaHero/Clinician/ScreeningRecord.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitahero.health.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
