name: VitaHero
options:
  bundleIdPrefix: com.vitahero
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO

targets:
  VitaHero:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VitaHero
    info:
      path: VitaHero/Info.plist
      properties:
        CFBundleIdentifier: com.vitahero.health
        CFBundleShortVersionString: "1.1.5"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: VitaHero
        PRODUCT_BUNDLE_IDENTIFIER: com.vitahero.health
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
